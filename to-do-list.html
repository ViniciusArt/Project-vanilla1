<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do list</title>
    <style>
        body{
            background-color: blueviolet;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>To-do list</h1>
    <input type="text" placeholder="Adicionar tarefa" id="add-tarefa"> <input type="button" value="OK" id="btnOK">
    <ul class="lista"></ul>
    <script>
        let botao = document.querySelector('#btnOK');
        botao.addEventListener('click', RunBtn)
        let tarefas = []
        
        function RunBtn(event){
            let addTarefa = document.querySelector('#add-tarefa');
            let tarefaTXT = {
            texto: addTarefa.value,
            concluida: false
             }
            tarefas.push(tarefaTXT)
            
            let task = document.createElement('li');
            task.innerHTML =  `<input type="checkbox"> ${tarefaTXT.texto}`
            let itens_lista = document.querySelector('.lista');
            itens_lista.appendChild(task) //coloca o elemtento <li> dentro do ul
            console.log(tarefas.at(-1))


            
            
        }
    
    </script>

</body>
</html>
